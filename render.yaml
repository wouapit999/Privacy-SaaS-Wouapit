# Render Blueprint for the Privacy Presence Manager API (free, no credit card).
# Builds the existing monorepo API Dockerfile; DB is Neon, Redis is Upstash.
# Set DATABASE_URL, REDIS_URL, and FIELD_ENCRYPTION_KEY in the Render dashboard
# (they're marked sync:false so they never live in the repo).
services:
  - type: web
    name: ppm-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCOVERY_RESPECT_ROBOTS
        value: "true"
      - key: AI_PROVIDER
        value: stub
      - key: MAIL_PROVIDER
        value: stub
      - key: WEB_ORIGIN
        value: https://privacy-saas-wouapit.vercel.app
      # Auto-generated by Render (format is irrelevant for JWT signing / CSRF):
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      # Set these in the dashboard (secrets / your own URLs):
      - key: FIELD_ENCRYPTION_KEY   # must be a base64-encoded 32-byte key
        sync: false
      - key: DATABASE_URL           # your Neon connection string
        sync: false
      - key: REDIS_URL              # your Upstash rediss:// URL
        sync: false
