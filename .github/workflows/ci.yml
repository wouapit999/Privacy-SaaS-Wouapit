name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ppm
          POSTGRES_PASSWORD: ppm_local_password
          POSTGRES_DB: ppm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ppm:ppm_local_password@localhost:5432/ppm_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FIELD_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlbWUhISE=
      AI_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prisma generate + migrate
        run: pnpm --filter @ppm/api prisma:generate && pnpm --filter @ppm/api prisma:migrate:deploy

      - name: Unit tests
        run: pnpm --filter @ppm/api test

      - name: Integration tests
        run: pnpm --filter @ppm/api test:e2e

      - name: Build
        run: pnpm build
