name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ppm
          POSTGRES_PASSWORD: ppm_local_password
          POSTGRES_DB: ppm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ppm:ppm_local_password@localhost:5432/ppm_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FIELD_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlbWUhISE=
      AI_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (do not also set
      # `version:` here — action-setup@v4 errors on a double-specified version).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prisma generate + migrate
        run: pnpm --filter @ppm/api prisma:generate && pnpm --filter @ppm/api prisma:migrate:deploy

      - name: Unit tests
        run: pnpm --filter @ppm/api test

      - name: Integration tests
        run: pnpm --filter @ppm/api test:e2e

      - name: Build
        run: pnpm build

  # Auto-deploy on push to main, only after tests pass. Uses CLI tokens instead
  # of the platforms' GitHub App integrations (which require browser-based repo
  # authorization). Add these repo secrets: RAILWAY_TOKEN, VERCEL_TOKEN.
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway
        # Requires a PROJECT token (Railway → project → Settings → Tokens), which
        # scopes to this project+environment. Account/API tokens can't deploy.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN not set — skipping API deploy"; exit 0; fi
          npm i -g @railway/cli
          railway up --service api --ci

      # Runs even if the Railway step failed, so the two deploys are independent.
      - name: Deploy web to Vercel
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_PLByl7XheGBfCgDVT89quJSc
          VERCEL_PROJECT_ID: prj_nirkR8BvVHRx1jr4FA041qJ9nWdj
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set — skipping web deploy"; exit 0; fi
          npm i -g vercel@latest
          # Write the project link explicitly (mirrors a local `vercel link`),
          # then deploy — uploads apps/web and builds remotely.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
